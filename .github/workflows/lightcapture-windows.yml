name: LightCapture Windows preview
'on':
  push:
    branches:
      - windows-preview
    paths:
      - 'Windows/**'
      - '.github/workflows/lightcapture-windows.yml'
permissions:
  contents: read
concurrency:
  group: lightcapture-windows-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-preview:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out preview branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Smoke test exact checked-in preview
        run: |
          & './Windows/qa/windows-smoke.ps1' -Archive './Windows/downloads/LightCapture-Windows-x64-preview.zip' -ChecksumFile './Windows/downloads/SHA256SUMS.txt'

      - name: Fetch the pinned official Zig compiler
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '0.15.2'
          $name = "zig-x86_64-windows-$version"
          $archive = Join-Path $env:RUNNER_TEMP "$name.zip"
          $expected = '3a0ed1e8799a2f8ce2a6e6290a9ff22e6906f8227865911fb7ddedc3cc14cb0c'
          Invoke-WebRequest -Uri "https://ziglang.org/download/$version/$name.zip" -OutFile $archive -TimeoutSec 120
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expected) {
            throw 'Official Zig archive does not match the independently pinned SHA-256.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'zig')
          $tool = Join-Path $env:RUNNER_TEMP "zig/$name/zig.exe"
          if ((& $tool version) -ne $version -or $LASTEXITCODE -ne 0) { throw 'Unexpected Zig executable version.' }
          "LIGHTCAPTURE_ZIG=$tool" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile strictly and run Windows synthetic tests
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'lightcapture-build'
          & './Windows/qa/build-windows.ps1' -Zig $env:LIGHTCAPTURE_ZIG -Project './Windows' -Output $output

      - name: Smoke test rebuilt executable
        run: |
          & './Windows/qa/windows-smoke.ps1' -Executable (Join-Path $env:RUNNER_TEMP 'lightcapture-build/LightCapture.exe')
